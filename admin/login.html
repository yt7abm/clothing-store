<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول | Sukkar Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #b2437b;
  --brand-dark: #8a305f;
  --brand-light: #d98cb4;
  --mint-pill: #a0cdc6;
  --pink-card: #f6c6de;
  --ink: #4a2338;
  --warm-white: #fffaf5;
  --bg-light: #fdf6f9;
  
  --primary: var(--brand);
  --primary-light: var(--brand-light);
  --primary-dark: var(--brand-dark);
  --accent: #f59e0b;
  --gold: #d4af37;
  --bg: #ffffff;
  --bg-2: #f9fafb;
  --text: var(--ink);
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --danger: #ef4444;
  --success: #10b981;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 40px rgba(178,67,123,0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; height: 100%; }

body {
  background: var(--warm-white);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

/* خلفية متحركة */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 20%, rgba(178, 67, 123, 0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(160, 205, 198, 0.1), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(246, 198, 222, 0.1), transparent 60%);
  z-index: -1;
  pointer-events: none;
  animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: 'Quicksand', sans-serif; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

/* ========== الصندوق الرئيسي ========== */
.login-container {
  width: 100%;
  max-width: 440px;
  background: #fff;
  border-radius: 28px;
  padding: 45px 35px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--pink-card);
  position: relative;
  animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* شريط علوي مزخرف */
.login-container::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 6px;
  background: repeating-linear-gradient(90deg, var(--brand) 0 30px, var(--mint-pill) 30px 60px);
}

/* ========== الشعار ========== */
.login-logo {
  text-align: center;
  margin-bottom: 25px;
}

.login-logo-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 15px;
  background: #fff;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 25px rgba(178,67,123,0.2);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.login-logo h1 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--brand);
  margin-bottom: 5px;
}

.login-logo p {
  color: var(--text-muted);
  font-size: 0.85rem;
  letter-spacing: 1px;
  font-weight: 600;
}

/* ========== رسالة الخطأ ========== */
.error-message {
  background: rgba(239, 68, 68, 0.08);
  color: var(--danger);
  border: 1.5px solid rgba(239, 68, 68, 0.2);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  animation: shake 0.5s;
}

.error-message.show { display: flex; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ========== النموذج ========== */
.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.input-wrapper {
  position: relative;
}

.input-wrapper input {
  width: 100%;
  padding: 15px 50px 15px 18px;
  font-size: 0.95rem;
  font-family: 'Quicksand', sans-serif;
  font-weight: 600;
  background: var(--bg-light);
  border: 2px solid var(--pink-card);
  border-radius: 14px;
  color: var(--text);
  transition: all 0.3s;
}

.input-wrapper input:focus {
  outline: none;
  border-color: var(--brand);
  background: white;
  box-shadow: 0 0 0 4px rgba(178,67,123,0.1);
}

.input-wrapper input::placeholder {
  color: #b08aa0;
  font-weight: 500;
}

.input-wrapper .input-icon {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  color: var(--brand-light);
  pointer-events: none;
  transition: color 0.3s;
}

.input-wrapper input:focus + .input-icon {
  color: var(--brand);
}

/* زر إظهار كلمة المرور */
.toggle-password {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  color: var(--brand-light);
  cursor: pointer;
  padding: 5px;
  transition: color 0.3s;
  background: none;
  border: none;
}

.toggle-password:hover {
  color: var(--brand);
}

/* ========== زر الدخول ========== */
.login-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: white;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 800;
  font-family: 'Baloo 2', cursive;
  transition: all 0.3s;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 10px 25px rgba(178,67,123,0.25);
  position: relative;
  overflow: hidden;
}

.login-btn::before {
  content: '';
  position: absolute;
  top: 0;
  right: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: right 0.6s;
}

.login-btn:hover::before {
  right: 100%;
}

.login-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(178,67,123,0.35);
}

.login-btn:active:not(:disabled) {
  transform: translateY(-1px);
}

.login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* ========== رابط العودة ========== */
.back-home {
  text-align: center;
  margin-top: 25px;
  padding-top: 25px;
  border-top: 2px dashed var(--pink-card);
}

.back-home a {
  color: var(--brand);
  font-size: 0.85rem;
  font-weight: 700;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.back-home a:hover {
  color: var(--brand-dark);
  gap: 10px;
}

/* ========== معلومات تحت ========== */
.login-info {
  text-align: center;
  margin-top: 20px;
  color: var(--text-muted);
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
}

.login-info .icon {
  color: var(--brand);
  font-size: 0.9rem;
}

/* ========== Responsive ========== */
@media (max-width: 600px) {
  body { padding: 15px; }
  
  .login-container {
    padding: 35px 22px;
    border-radius: 24px;
  }
  
  .login-logo-icon {
    width: 70px;
    height: 70px;
    border-radius: 20px;
  }
  
  .login-logo h1 { font-size: 1.5rem; }
  .login-logo p { font-size: 0.75rem; }
  
  .input-wrapper input {
    padding: 14px 45px 14px 15px;
    font-size: 0.9rem;
  }
  
  .input-wrapper .input-icon { right: 15px; font-size: 1.1rem; }
  .toggle-password { left: 12px; font-size: 1rem; }
  
  .login-btn { padding: 15px; font-size: 0.95rem; }
  
  .back-home { margin-top: 20px; padding-top: 20px; }
  .back-home a { font-size: 0.8rem; }
}

@media (max-width: 360px) {
  .login-container { padding: 30px 18px; }
  .login-logo-icon { width: 60px; height: 60px; }
  .login-logo h1 { font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="login-container">
  
  <!-- الشعار -->
  <div class="login-logo">
    <div class="login-logo-icon">
      <svg viewBox="0 0 320 85" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: auto;">
        <g transform="translate(2,30)">
          <path d="M30 22 C 18 4, -2 6, 4 20 C 8 30, 20 30, 30 22 Z" fill="#f9a7c6" stroke="#e26a98" stroke-width="1.8"/>
          <path d="M30 22 C 42 4, 62 6, 56 20 C 52 30, 40 30, 30 22 Z" fill="#f9a7c6" stroke="#e26a98" stroke-width="1.8"/>
          <circle cx="30" cy="22" r="4" fill="#e26a98"/>
          <path d="M30 26 C 28 36, 24 46, 20 54" stroke="#e26a98" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M30 26 C 32 36, 36 46, 40 54" stroke="#e26a98" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(48,18)">
          <path d="M14 10 L 10 -4 L 24 4 Z" fill="#f4a35e" stroke="#d97e3a" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M36 10 L 40 -4 L 26 4 Z" fill="#f4a35e" stroke="#d97e3a" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="25" cy="20" r="16" fill="#f8b878" stroke="#d97e3a" stroke-width="1.5"/>
          <path d="M15 8 L 13 0 L 21 4 Z" fill="#ffd6b0"/>
          <path d="M35 8 L 37 0 L 29 4 Z" fill="#ffd6b0"/>
          <circle cx="19" cy="19" r="2" fill="#3a2419"/>
          <circle cx="31" cy="19" r="2" fill="#3a2419"/>
          <circle cx="19.5" cy="18.5" r="0.6" fill="#fff"/>
          <circle cx="31.5" cy="18.5" r="0.6" fill="#fff"/>
          <path d="M23 24 L 27 24 L 25 26 Z" fill="#e2738d"/>
          <path d="M25 26 C 25 28, 22 29, 21 28" stroke="#3a2419" stroke-width="1" fill="none" stroke-linecap="round"/>
          <path d="M25 26 C 25 28, 28 29, 29 28" stroke="#3a2419" stroke-width="1" fill="none" stroke-linecap="round"/>
          <line x1="12" y1="22" x2="4" y2="21" stroke="#3a2419" stroke-width="0.8" stroke-linecap="round"/>
          <line x1="12" y1="25" x2="4" y2="26" stroke="#3a2419" stroke-width="0.8" stroke-linecap="round"/>
          <line x1="38" y1="22" x2="46" y2="21" stroke="#3a2419" stroke-width="0.8" stroke-linecap="round"/>
          <line x1="38" y1="25" x2="46" y2="26" stroke="#3a2419" stroke-width="0.8" stroke-linecap="round"/>
          <circle cx="16" cy="24" r="2.2" fill="#ffb0c8" opacity="0.6"/>
          <circle cx="34" cy="24" r="2.2" fill="#ffb0c8" opacity="0.6"/>
        </g>
        <g font-family="'Baloo 2', cursive" font-weight="800" font-size="56" fill="#b2437b">
          <text x="100" y="58">S</text>
          <text x="135" y="58">U</text>
          <text x="172" y="58">K</text>
          <text x="208" y="58">K</text>
          <text x="244" y="58">A</text>
          <text x="280" y="58">R</text>
        </g>
        <g font-family="'Quicksand', sans-serif" font-weight="700" font-size="14" fill="#e07fa9" letter-spacing="7">
          <text x="100" y="78">STORE</text>
        </g>
        <g stroke="#e8a5b8" stroke-width="2.2" stroke-linecap="round" fill="none" transform="translate(300,40)">
          <path d="M0 0 C 4 -3, 8 0, 4 3"/>
          <path d="M0 8 C 4 5, 8 8, 4 11"/>
          <path d="M0 16 C 4 13, 8 16, 4 19"/>
        </g>
      </svg>
    </div>
    <h1>Sukkar Store</h1>
    <p>لوحة التحكم الإدارية</p>
  </div>

  <!-- رسالة الخطأ -->
  <div class="error-message" id="errorMessage">
    <span>⚠️</span>
    <span id="errorText">حدث خطأ</span>
  </div>

  <!-- النموذج -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" autofocus required>
        <span class="input-icon">👤</span>
      </div>
    </div>

    <div class="form-group">
      <label>🔒 كلمة المرور</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        <span class="input-icon">🔒</span>
        <button type="button" class="toggle-password" onclick="togglePassword()" id="toggleBtn">👁️</button>
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span>دخول</span>
      <span>←</span>
    </button>

  </form>

  <!-- رابط العودة -->
  <div class="back-home">
    <a href="../index.html">← العودة للمتجر</a>
  </div>

  <!-- معلومات -->
  <div class="login-info">
    <span class="icon">🔒</span>
    <span>دخول آمن ومشفر</span>
  </div>

</div>

<script>
const API_URL = '/api';

// ========== التحقق من الجلسة السابقة ==========
const existingToken = localStorage.getItem('sukkar_token');
if (existingToken) {
  verifyToken(existingToken);
}

async function verifyToken(token) {
  try {
    const res = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('sukkar_user', JSON.stringify(data.user));
      localStorage.setItem('sukkar_permissions', JSON.stringify(data.permissions));
      window.location.href = 'dashboard.html';
    } else {
      localStorage.removeItem('sukkar_token');
      localStorage.removeItem('sukkar_user');
      localStorage.removeItem('sukkar_permissions');
    }
  } catch (error) {
    console.error(error);
  }
}

// ========== تسجيل الدخول ==========
async function handleLogin(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMessage');
  const errorText = document.getElementById('errorText');
  
  if (!username || !password) {
    showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span>⏳ جاري التحقق...</span>';
  errorMsg.classList.remove('show');
  
  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('sukkar_token', data.token);
      localStorage.setItem('sukkar_user', JSON.stringify(data.user));
      localStorage.setItem('sukkar_permissions', JSON.stringify(data.permissions));
      
      btn.innerHTML = '<span>✅ تم الدخول</span>';
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
      
    } else {
      showError(data.message || 'بيانات الدخول غير صحيحة');
      btn.disabled = false;
      btn.innerHTML = '<span>دخول</span><span>←</span>';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
    
  } catch (error) {
    showError('تعذّر الاتصال بالسيرفر');
    btn.disabled = false;
    btn.innerHTML = '<span>دخول</span><span>←</span>';
  }
}

// ========== إظهار/إخفاء كلمة المرور ==========
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggleBtn');
  
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// ========== إظهار الخطأ ==========
function showError(msg) {
  const errorMsg = document.getElementById('errorMessage');
  const errorText = document.getElementById('errorText');
  
  errorText.textContent = msg;
  errorMsg.classList.add('show');
  
  const container = document.querySelector('.login-container');
  container.style.animation = 'none';
  setTimeout(() => {
    container.style.animation = 'shake 0.5s';
  }, 10);
}
</script>

</body>
</html>
