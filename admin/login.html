<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول | Sukkar Store</title>
<link rel="icon" type="image/jpeg" href="../assets/12.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#b2437b; --brand-dark:#8a305f; --brand-deep:#5e1f41;
  --pink-soft:#f8cfd8; --mint:#b8e5e0; --mint-dark:#2f7a72; --yellow:#ffde59; --gold:#a87400;
  --ink:#4a2338; --bg:#fffaf5; --line:#f1e4ea; --muted:#8a7a82;
  --success:#2e9e5b; --danger:#d23b3b; --warn:#e8a900;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%, rgba(178,67,123,.08), transparent 40%), radial-gradient(circle at 80% 80%, rgba(184,229,224,.1), transparent 40%), radial-gradient(circle at 50% 50%, rgba(248,207,216,.1), transparent 60%);z-index:-1;pointer-events:none}
img{max-width:100%;display:block}
button{cursor:pointer;border:none;background:none;color:inherit}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid rgba(178,67,123,.45);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Login Container */
.login-container{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:40px 30px;box-shadow:0 20px 50px rgba(178,67,123,.15);border:1px solid var(--line);position:relative;overflow:hidden;animation:slideUp .6s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-container::before{content:'';position:absolute;top:0;right:0;left:0;height:6px;background:repeating-linear-gradient(90deg,var(--brand) 0 40px,#f6e6ec 40px 80px)}

/* Logo */
.logo-wrap{text-align:center;margin-bottom:30px}
.logo-icon{width:80px;height:80px;margin:0 auto 15px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(178,67,123,.25);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logo-icon .ic{font-size:40px;color:#fff}
.logo-wrap h1{font-family:'Baloo 2',sans-serif;font-size:1.8rem;font-weight:800;color:var(--brand);margin-bottom:4px}
.logo-wrap p{font-size:.85rem;color:var(--muted);font-weight:700}

/* Error */
.err-box{background:#fde8e8;color:var(--danger);border:2px solid #f3b4b4;padding:12px;border-radius:14px;font-size:.9rem;font-weight:800;margin-bottom:20px;display:none;align-items:center;justify-content:center;gap:8px;text-align:center}
.err-box.show{display:flex;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Form */
.field{margin-bottom:18px}
.field label{display:block;font-weight:800;font-size:.95rem;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:14px 46px 14px 16px;font-size:16px;font-weight:700;background:#fdf8fa;border:2px solid #efdde5;border-radius:14px;color:var(--ink);outline:none;transition:.2s}
.input-wrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(178,67,123,.12)}
.input-wrap input::placeholder{color:#b8a0b0;font-weight:600}
.input-wrap .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#b8a0b0;pointer-events:none;transition:.2s}
.input-wrap input:focus ~ .ic{color:var(--brand)}
.toggle-pass{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:18px;transition:.2s}
.toggle-pass:hover{background:#fdf1f5}

/* Button */
.login-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-radius:14px;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(178,67,123,.3);transition:.2s;margin-top:10px}
.login-btn .ic{font-size:20px}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 25px rgba(178,67,123,.4)}
.login-btn:active:not(:disabled){transform:scale(.98)}
.login-btn:disabled{opacity:.7;cursor:not-allowed}

/* Footer */
.footer-link{text-align:center;margin-top:24px;padding-top:20px;border-top:2px dashed var(--line)}
.footer-link a{color:var(--brand);font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.footer-link a:hover{color:var(--brand-dark);gap:10px}
.footer-link a .ic{font-size:16px}

.secure-note{text-align:center;margin-top:16px;color:var(--muted);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.secure-note .ic{font-size:16px;color:var(--brand)}

/* Responsive */
@media(max-width:480px){
  body{padding:15px}
  .login-container{padding:30px 20px;border-radius:24px}
  .logo-icon{width:70px;height:70px}
  .logo-wrap h1{font-size:1.5rem}
  .login-btn{padding:14px;font-size:1rem}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
</svg>

<div class="login-container">
  <div class="logo-wrap">
    <div class="logo-icon"><svg class="ic"><use href="#i-shield"/></svg></div>
    <h1>SUKKAR STORE</h1>
    <p>لوحة التحكم الإدارية</p>
  </div>

  <div class="err-box" id="errorMessage">
    <svg class="ic"><use href="#i-alert"/></svg>
    <span id="errorText">حدث خطأ</span>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" autofocus required>
        <svg class="ic"><use href="#i-user"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        <svg class="ic"><use href="#i-lock"/></svg>
        <button type="button" class="toggle-pass" onclick="togglePassword()" id="toggleBtn" aria-label="إظهار كلمة المرور">
          <svg class="ic"><use href="#i-eye"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span>دخول</span>
      <svg class="ic"><use href="#i-login"/></svg>
    </button>
  </form>

  <div class="footer-link">
    <a href="../index.html"><svg class="ic"><use href="#i-arrow-left"/></svg> العودة للمتجر</a>
  </div>

  <div class="secure-note">
    <svg class="ic"><use href="#i-shield"/></svg>
    <span>دخول آمن ومشفر</span>
  </div>
</div>

<script>
const API_URL = '/api';

// ========== التحقق من الجلسة السابقة ==========
const existingToken = localStorage.getItem('sukkar_token');
if(existingToken){
  verifyToken(existingToken);
}

async function verifyToken(token){
  try{
    const res = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    
    if(data.success){
      localStorage.setItem('sukkar_user', JSON.stringify(data.user));
      localStorage.setItem('sukkar_permissions', JSON.stringify(data.permissions));
      window.location.href = 'dashboard.html';
    } else {
      clearSession();
    }
  }catch(e){ console.error(e); }
}

function clearSession(){
  ['sukkar_token','sukkar_user','sukkar_permissions'].forEach(k => localStorage.removeItem(k));
}

// ========== تسجيل الدخول ==========
async function handleLogin(e){
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('errorMessage');
  const errText = document.getElementById('errorText');
  
  if(!username || !password){
    showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span>جاري التحقق...</span>';
  errBox.classList.remove('show');
  
  try{
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if(data.success){
      localStorage.setItem('sukkar_token', data.token);
      localStorage.setItem('sukkar_user', JSON.stringify(data.user));
      localStorage.setItem('sukkar_permissions', JSON.stringify(data.permissions));
      
      btn.innerHTML = '<svg class="ic"><use href="#i-check"/></svg> <span>تم الدخول</span>';
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
    } else {
      showError(data.message || 'بيانات الدخول غير صحيحة');
      btn.disabled = false;
      btn.innerHTML = '<span>دخول</span><svg class="ic"><use href="#i-login"/></svg>';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }catch(e){
    showError('تعذّر الاتصال بالسيرفر');
    btn.disabled = false;
    btn.innerHTML = '<span>دخول</span><svg class="ic"><use href="#i-login"/></svg>';
  }
}

// ========== إظهار/إخفاء كلمة المرور ==========
function togglePassword(){
  const input = document.getElementById('password');
  const btn = document.getElementById('toggleBtn');
  
  if(input.type === 'password'){
    input.type = 'text';
    btn.innerHTML = '<svg class="ic"><use href="#i-eye-off"/></svg>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<svg class="ic"><use href="#i-eye"/></svg>';
  }
}

// ========== إظهار الخطأ ==========
function showError(msg){
  const errBox = document.getElementById('errorMessage');
  const errText = document.getElementById('errorText');
  
  errText.textContent = msg;
  errBox.classList.add('show');
  
  const container = document.querySelector('.login-container');
  container.style.animation = 'none';
  setTimeout(() => { container.style.animation = 'shake .4s'; }, 10);
}
</script>
</body>
</html>
