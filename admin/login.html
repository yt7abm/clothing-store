<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول - متجر راقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1e3a8a;
  --primary-light: #3b82f6;
  --primary-dark: #1e40af;
  --accent: #f59e0b;
  --accent-2: #ec4899;
  --gold: #d4af37;
  --bg: #ffffff;
  --bg-2: #f9fafb;
  --bg-3: #f3f4f6;
  --text: #1f2937;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --success: #10b981;
  --danger: #ef4444;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 40px rgba(30, 58, 138, 0.12);
  --shadow-xl: 0 20px 60px rgba(30, 58, 138, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

/* خلفية متحركة */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 20%, rgba(30, 58, 138, 0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.04), transparent 60%);
  z-index: -1;
  pointer-events: none;
  animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: 'Cairo', sans-serif; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

/* ========== الصندوق الرئيسي ========== */
.login-container {
  width: 100%;
  max-width: 440px;
  background: white;
  border-radius: 28px;
  padding: 45px 35px;
  box-shadow: 0 25px 70px rgba(30, 58, 138, 0.15);
  border: 1px solid var(--border);
  position: relative;
  animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* شريط علوي مزخرف */
.login-container::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 6px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--gold));
}

/* ========== الشعار ========== */
.login-logo {
  text-align: center;
  margin-bottom: 25px;
}

.login-logo-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 15px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 2.2rem;
  box-shadow: 0 12px 30px rgba(30, 58, 138, 0.3);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.login-logo h1 {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 5px;
}

.login-logo p {
  color: var(--text-muted);
  font-size: 0.85rem;
  letter-spacing: 1px;
}

/* ========== رسالة الخطأ ========== */
.error-message {
  background: rgba(239, 68, 68, 0.08);
  color: var(--danger);
  border: 1.5px solid rgba(239, 68, 68, 0.2);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  animation: shake 0.5s;
}

.error-message.show { display: flex; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ========== النموذج ========== */
.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.input-wrapper {
  position: relative;
}

.input-wrapper input {
  width: 100%;
  padding: 15px 50px 15px 18px;
  font-size: 0.95rem;
  font-family: 'Cairo', sans-serif;
  background: var(--bg-2);
  border: 2px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  transition: all 0.3s;
}

.input-wrapper input:focus {
  outline: none;
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.08);
}

.input-wrapper input::placeholder {
  color: var(--text-muted);
}

.input-wrapper .input-icon {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  color: var(--text-muted);
  pointer-events: none;
  transition: color 0.3s;
}

.input-wrapper input:focus + .input-icon {
  color: var(--primary);
}

/* زر إظهار كلمة المرور */
.toggle-password {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  color: var(--text-muted);
  cursor: pointer;
  padding: 5px;
  transition: color 0.3s;
  background: none;
  border: none;
}

.toggle-password:hover {
  color: var(--primary);
}

/* ========== زر الدخول ========== */
.login-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 900;
  font-family: 'Cairo', sans-serif;
  transition: all 0.3s;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 10px 25px rgba(30, 58, 138, 0.25);
  position: relative;
  overflow: hidden;
}

.login-btn::before {
  content: '';
  position: absolute;
  top: 0;
  right: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: right 0.6s;
}

.login-btn:hover::before {
  right: 100%;
}

.login-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(30, 58, 138, 0.35);
}

.login-btn:active:not(:disabled) {
  transform: translateY(-1px);
}

.login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* ========== رابط العودة ========== */
.back-home {
  text-align: center;
  margin-top: 25px;
  padding-top: 25px;
  border-top: 1px solid var(--border);
}

.back-home a {
  color: var(--text-muted);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.back-home a:hover {
  color: var(--primary);
  gap: 10px;
}

/* ========== معلومات تحت ========== */
.login-info {
  text-align: center;
  margin-top: 20px;
  color: var(--text-muted);
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.login-info .icon {
  color: var(--primary);
  font-size: 0.9rem;
}

/* ========== Responsive ========== */
@media (max-width: 600px) {
  body { padding: 15px; }
  
  .login-container {
    padding: 35px 22px;
    border-radius: 24px;
  }
  
  .login-logo-icon {
    width: 70px;
    height: 70px;
    font-size: 1.9rem;
    border-radius: 20px;
  }
  
  .login-logo h1 { font-size: 1.4rem; }
  .login-logo p { font-size: 0.75rem; }
  
  .input-wrapper input {
    padding: 14px 45px 14px 15px;
    font-size: 0.9rem;
  }
  
  .input-wrapper .input-icon { right: 15px; font-size: 1.1rem; }
  .toggle-password { left: 12px; font-size: 1rem; }
  
  .login-btn { padding: 15px; font-size: 0.95rem; }
  
  .back-home { margin-top: 20px; padding-top: 20px; }
  .back-home a { font-size: 0.8rem; }
}

@media (max-width: 360px) {
  .login-container { padding: 30px 18px; }
  .login-logo-icon { width: 60px; height: 60px; font-size: 1.6rem; }
  .login-logo h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="login-container">
  
  <!-- الشعار -->
  <div class="login-logo">
    <div class="login-logo-icon">🔐</div>
    <h1>متجر راقي</h1>
    <p>لوحة التحكم</p>
  </div>

  <!-- رسالة الخطأ -->
  <div class="error-message" id="errorMessage">
    <span>⚠️</span>
    <span id="errorText">حدث خطأ</span>
  </div>

  <!-- النموذج -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" autofocus required>
        <span class="input-icon">👤</span>
      </div>
    </div>

    <div class="form-group">
      <label>🔒 كلمة المرور</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        <span class="input-icon">🔒</span>
        <button type="button" class="toggle-password" onclick="togglePassword()" id="toggleBtn">👁️</button>
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span>دخول</span>
      <span>→</span>
    </button>

  </form>

  <!-- رابط العودة -->
  <div class="back-home">
    <a href="../index.html">← العودة للمتجر</a>
  </div>

  <!-- معلومات -->
  <div class="login-info">
    <span class="icon">🔒</span>
    <span>دخول آمن ومشفر</span>
  </div>

</div>

<script>
const API_URL = '/api';

// ========== التحقق من الجلسة السابقة ==========
const existingToken = localStorage.getItem('raki_token');
if (existingToken) {
  verifyToken(existingToken);
}

async function verifyToken(token) {
  try {
    const res = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    
    if (data.success) {
      // تحديث البيانات
      localStorage.setItem('raki_user', JSON.stringify(data.user));
      localStorage.setItem('raki_permissions', JSON.stringify(data.permissions));
      
      // التوجيه
      if (data.user.is_admin) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    } else {
      localStorage.removeItem('raki_token');
      localStorage.removeItem('raki_user');
      localStorage.removeItem('raki_permissions');
    }
  } catch (error) {
    console.error(error);
  }
}

// ========== تسجيل الدخول ==========
async function handleLogin(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMessage');
  const errorText = document.getElementById('errorText');
  
  // التحقق
  if (!username || !password) {
    showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
    return;
  }
  
  // تعطيل الزر
  btn.disabled = true;
  btn.innerHTML = '<span>⏳ جاري التحقق...</span>';
  errorMsg.classList.remove('show');
  
  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if (data.success) {
      // حفظ البيانات
      localStorage.setItem('raki_token', data.token);
      localStorage.setItem('raki_user', JSON.stringify(data.user));
      localStorage.setItem('raki_permissions', JSON.stringify(data.permissions));
      
      // رسالة نجاح
      btn.innerHTML = '<span>✅ تم الدخول</span>';
      
      // التوجيه
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
      
    } else {
      showError(data.message || 'بيانات الدخول غير صحيحة');
      btn.disabled = false;
      btn.innerHTML = '<span>دخول</span><span>→</span>';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
    
  } catch (error) {
    showError('تعذّر الاتصال بالسيرفر');
    btn.disabled = false;
    btn.innerHTML = '<span>دخول</span><span>→</span>';
  }
}

// ========== إظهار/إخفاء كلمة المرور ==========
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggleBtn');
  
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// ========== إظهار الخطأ ==========
function showError(msg) {
  const errorMsg = document.getElementById('errorMessage');
  const errorText = document.getElementById('errorText');
  
  errorText.textContent = msg;
  errorMsg.classList.add('show');
  
  // اهتزاز
  const container = document.querySelector('.login-container');
  container.style.animation = 'none';
  setTimeout(() => {
    container.style.animation = 'shake 0.5s';
  }, 10);
}
</script>

</body>
</html>
