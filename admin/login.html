<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #8b5cf6;
  --primary-light: #a78bfa;
  --primary-dark: #6d28d9;
  --accent: #fbbf24;
  --accent-2: #f472b6;
  --bg: #0f0b1e;
  --card: #1e1b3a;
  --card-2: #252047;
  --text: #f5f3ff;
  --text-muted: #a5a1b8;
  --border: rgba(139, 92, 246, 0.2);
  --danger: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.2), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(244, 114, 182, 0.15), transparent 40%),
              radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.05), transparent 60%);
  z-index: -1;
  pointer-events: none;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(135deg, var(--card), var(--card-2));
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 50px 40px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.logo-container {
  text-align: center;
  margin-bottom: 35px;
}

.logo-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 15px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  box-shadow: 0 15px 40px rgba(139, 92, 246, 0.4);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.logo {
  font-size: 1.8rem;
  font-weight: 900;
  font-family: 'Playfair Display', 'Cairo', sans-serif;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--text-muted);
  font-size: 0.95rem;
}

.error-msg {
  background: rgba(239, 68, 68, 0.15);
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 0.9rem;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  animation: shake 0.5s;
}

.error-msg.show { display: flex; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 10px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.input-wrapper {
  position: relative;
}

.input-wrapper .input-icon {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  color: var(--text-muted);
  pointer-events: none;
  transition: color 0.3s;
}

.input-wrapper input:focus + .input-icon {
  color: var(--primary-light);
}

input {
  width: 100%;
  padding: 16px 50px 16px 16px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-size: 1rem;
  font-family: 'Cairo', sans-serif;
  transition: all 0.3s;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
}

input.error {
  border-color: var(--danger);
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
  animation: shake 0.5s;
}

button[type="submit"] {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 17px;
  border: none;
  border-radius: 14px;
  font-size: 1.1rem;
  font-weight: 800;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 15px 40px rgba(139, 92, 246, 0.3);
}

button[type="submit"]:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 20px 50px rgba(139, 92, 246, 0.5);
}

button[type="submit"]:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.back-home {
  text-align: center;
  margin-top: 25px;
  padding-top: 25px;
  border-top: 1px solid var(--border);
}

.back-home a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.back-home a:hover {
  color: var(--primary-light);
}

/* ========== Mobile ========== */
@media (max-width: 500px) {
  body { padding: 15px; }
  .login-box { padding: 35px 25px; border-radius: 20px; }
  .logo-icon { width: 65px; height: 65px; font-size: 2rem; }
  .logo { font-size: 1.4rem; }
  .subtitle { font-size: 0.85rem; }
  input { padding: 14px 45px 14px 14px; font-size: 0.95rem; }
  button[type="submit"] { padding: 15px; font-size: 1rem; }
  .form-group label { font-size: 0.9rem; }
}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-container">
    <div class="logo-icon">🔐</div>
    <div class="logo">متجر راقي</div>
    <div class="subtitle">لوحة التحكم</div>
  </div>
  
  <div class="error-msg" id="errorMsg"></div>
  
  <form id="loginForm" onsubmit="login(event)">
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" autofocus>
        <span class="input-icon">👤</span>
      </div>
    </div>
    
    <div class="form-group">
      <label>🔒 كلمة المرور</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        <span class="input-icon">🔒</span>
      </div>
    </div>
    
    <button type="submit" id="loginBtn">
      <span>دخول</span>
      <span>→</span>
    </button>
  </form>
  
<div class="back-home">
    <a href="../index.html">← العودة للمتجر</a>
  </div>
</div>

<script>
const API_URL = 'http://localhost:3000/api';

// التحقق من وجود جلسة سابقة
const token = localStorage.getItem('raki_token');
if (token) {
  verifyToken(token);
}

async function verifyToken(token) {
  try {
    const res = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = 'dashboard.html';
    } else {
      localStorage.removeItem('raki_token');
      localStorage.removeItem('raki_user');
    }
  } catch (error) {
    console.error(error);
  }
}

async function login(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  
  if (!username || !password) {
    showError('⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span>⏳ جاري التحقق...</span>';
  errorMsg.classList.remove('show');
  
  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('raki_token', data.token);
      localStorage.setItem('raki_user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } else {
      showError('❌ ' + data.message);
      btn.disabled = false;
      btn.innerHTML = '<span>دخول</span><span>→</span>';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch (error) {
    showError('❌ تعذّر الاتصال بالسيرفر');
    btn.disabled = false;
    btn.innerHTML = '<span>دخول</span><span>→</span>';
  }
}

function showError(msg) {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
  
  document.querySelectorAll('input').forEach(input => {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 600);
  });
}
</script>

</body>
</html>
