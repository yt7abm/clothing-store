<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>إدارة الطلبات | Sukkar Store</title>
<link rel="icon" type="image/jpeg" href="../assets/12.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#b2437b; --brand-dark:#8a305f; --brand-deep:#5e1f41;
  --pink-soft:#f8cfd8; --mint:#b8e5e0; --mint-dark:#2f7a72; --yellow:#ffde59; --gold:#a87400;
  --ink:#4a2338; --bg:#fffaf5; --line:#f1e4ea; --muted:#8a7a82;
  --success:#2e9e5b; --danger:#d23b3b; --warn:#e8a900; --whatsapp:#25d366; --self:#8b5cf6;
  --top-h:72px; --side-w:268px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.lock{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid rgba(178,67,123,.45);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.omr-img{display:inline-block;vertical-align:middle;width:15px;height:auto}

/* TOP */
.top{position:fixed;top:0;right:0;left:0;z-index:1000;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.stripes{height:10px;background:repeating-linear-gradient(90deg,#de98b5 0 40px,#f6e6ec 40px 80px)}
.top-in{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.grp{display:flex;align-items:center;gap:6px;min-width:0}
.icon-btn{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);font-size:24px;flex-shrink:0}
.icon-btn:hover{background:#fdf1f5}
.icon-btn:active{background:var(--pink-soft)}
.icon-btn.danger{color:var(--danger)}
.icon-btn.danger:hover{background:#fde8e8}
.brand{line-height:1;text-align:center}
.brand b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.7rem;font-weight:800;color:var(--brand);letter-spacing:1px}
.brand small{display:block;font-size:.6rem;letter-spacing:6px;color:#d4739f;font-weight:700;margin-top:2px;padding-right:6px}
.badge-admin{background:var(--pink-soft);color:var(--brand-dark);font-weight:800;font-size:.8rem;padding:3px 12px;border-radius:20px;white-space:nowrap}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 6px;border:2px solid var(--line);border-radius:30px;background:#fff;transition:.2s}
.user-btn:hover{border-color:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.u-txt{text-align:right;line-height:1.2}
.u-txt b{display:block;font-size:.9rem;font-weight:800;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-txt small{font-size:.72rem;color:var(--muted);font-weight:700}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(94,31,65,.2);padding:10px;z-index:1200}
.menu .who{text-align:center;padding:8px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who .avatar{width:56px;height:56px;font-size:1.4rem;margin:0 auto 6px}
.menu .who b{display:block;font-weight:800}
.menu .who small{color:var(--muted);font-weight:700}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:12px;font-weight:700;text-align:right}
.menu a:hover,.menu button:hover{background:#fdf1f5}
.menu .out{color:var(--danger)}
.menu .out:hover{background:#fde8e8}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--top-h);right:0;width:var(--side-w);height:calc(100vh - var(--top-h));height:calc(100dvh - var(--top-h));background:#fff;border-left:1px solid var(--line);padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:900;transition:transform .3s}
.side-sec{margin-bottom:18px}
.side-t{font-size:.8rem;font-weight:800;color:var(--muted);padding:0 12px;margin-bottom:6px}
.s-link{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;font-weight:700;font-size:1.02rem;margin-bottom:3px;transition:.15s}
.s-link .ic{font-size:22px;color:var(--brand)}
.s-link:hover{background:#fdf1f5}
.s-link.active{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;box-shadow:0 6px 16px rgba(178,67,123,.3)}
.s-link.active .ic{color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:850}
.overlay.open{opacity:1;pointer-events:auto}

/* MAIN */
.main{margin-right:var(--side-w);padding:calc(var(--top-h) + 18px) 22px 50px;min-height:100vh;max-width:calc(1180px + var(--side-w))}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:200px;height:200px;top:-80px;left:-40px}
.hero::after{width:170px;height:170px;bottom:-80px;right:-40px;background:rgba(255,222,89,.14)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:1.7rem;font-weight:800;line-height:1.3;display:flex;align-items:center;gap:10px}
.hero h1 .ic{font-size:28px}
.hero p{font-weight:600;opacity:.92}

/* TABS */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.tab{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 6px;font-weight:800;font-size:.9rem;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.tab .ic{font-size:18px;color:var(--brand)}
.tab span{background:var(--pink-soft);color:var(--brand-dark);padding:2px 8px;border-radius:20px;font-size:.8rem}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(178,67,123,.3)}
.tab.on .ic{color:#fff}
.tab.on span{background:rgba(255,255,255,.25);color:#fff}
.tab:hover:not(.on){border-color:var(--brand)}

/* ORDER CARDS */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 14px rgba(94,31,65,.07);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(94,31,65,.12)}
.card::before{content:"";position:absolute;top:0;right:0;width:6px;height:100%}
.card.st-pending::before{background:var(--warn)}
.card.st-confirmed::before{background:var(--brand)}
.card.st-completed::before{background:var(--success)}
.card.st-cancelled::before{background:var(--danger)}

.c-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 10px;gap:10px;cursor:pointer}
.c-num{font-weight:800;font-size:1.05rem;color:var(--brand);margin-bottom:2px}
.c-date{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.c-date .ic{font-size:14px}
.c-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:800;white-space:nowrap}
.c-badge .ic{font-size:14px}
.b-pending{background:#fff1c9;color:#7a5600}
.b-confirmed{background:#fde8f0;color:var(--brand-dark)}
.b-completed{background:#e3f6ea;color:var(--success)}
.b-cancelled{background:#fde8e8;color:var(--danger)}

.c-cust{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.c-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-name{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-phone{font-size:.8rem;color:var(--muted);font-weight:600;direction:ltr;text-align:right}

.c-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);margin-top:auto}
.c-total{font-weight:800;font-size:1.1rem;color:var(--brand-dark);display:flex;align-items:center;gap:4px;direction:ltr}
.c-acts{display:flex;gap:6px}
.c-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.c-btn.wa{background:#e3f6ea;color:var(--success)} .c-btn.wa:hover{background:var(--success);color:#fff}
.c-btn.self{background:#f3ecef;color:var(--self)} .c-btn.self:hover{background:var(--self);color:#fff}
.c-btn.view{background:#fdf1f5;color:var(--brand)} .c-btn.view:hover{background:var(--brand);color:#fff}

/* STATES */
.state{text-align:center;padding:50px 16px;color:var(--muted);font-weight:700}
.state .ring{width:80px;height:80px;border-radius:50%;background:var(--pink-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 12px}
.state h3{font-size:1.25rem;font-weight:800;color:var(--ink)}
.sk{height:160px;border-radius:20px;background:linear-gradient(90deg,#f4e9ee 25%,#fbf3f6 50%,#f4e9ee 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);overflow-y:auto}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet.sm{max-width:440px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.sh-head h2{font-size:1.3rem;font-weight:800;color:var(--brand-dark);display:flex;align-items:center;gap:10px}
.sh-head h2 .ic{font-size:24px;color:var(--brand)}
.sh-x{width:42px;height:42px;border-radius:50%;background:#fdf1f5;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:20px}
.sh-body{padding:18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-shrink:0;background:#fff}

/* MODAL CONTENT */
.sec-title{font-weight:800;font-size:1rem;color:var(--brand);margin:16px 0 10px;display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:2px dashed var(--line)}
.sec-title:first-child{margin-top:0}
.info-box{background:#fdf8fa;border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.9rem}
.info-row .l{color:var(--muted);font-weight:600}
.info-row .v{font-weight:800;text-align:left;word-break:break-word;max-width:60%}

.items-list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px;background:#fdf8fa;border-radius:12px;border:1px solid var(--line)}
.item-img{width:48px;height:48px;border-radius:10px;background:#f3ecef;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-weight:700;font-size:.9rem;margin-bottom:2px}
.item-meta{font-size:.8rem;color:var(--muted)}
.item-price{font-weight:800;color:var(--brand-dark);display:flex;align-items:center;gap:3px;font-size:.95rem}

.totals{background:#fdf8fa;border-radius:14px;padding:14px;border:1px solid var(--line)}
.t-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;font-weight:600;color:var(--muted)}
.t-row .v{color:var(--ink);font-weight:800;display:flex;align-items:center;gap:3px}
.t-row.final{padding-top:10px;margin-top:6px;border-top:2px solid var(--line);font-size:1.1rem;color:var(--brand-dark);font-weight:800}
.t-row.final .v{font-size:1.3rem;color:var(--brand-dark)}

/* STATUS CHANGER */
.st-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.st-btn{padding:10px;border-radius:12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;transition:.2s;background:#fdf8fa;color:var(--muted)}
.st-btn.pending{color:#7a5600} .st-btn.pending:hover, .st-btn.pending.on{background:#fff1c9;border-color:var(--warn)}
.st-btn.confirmed{color:var(--brand)} .st-btn.confirmed:hover, .st-btn.confirmed.on{background:#fde8f0;border-color:var(--brand)}
.st-btn.completed{color:var(--success)} .st-btn.completed:hover, .st-btn.completed.on{background:#e3f6ea;border-color:var(--success)}
.st-btn.cancelled{color:var(--danger)} .st-btn.cancelled:hover, .st-btn.cancelled.on{background:#fde8e8;border-color:var(--danger)}
.st-btn.on{color:#fff}
.st-btn.pending.on{background:var(--warn);color:#fff}
.st-btn.confirmed.on{background:var(--brand);color:#fff}
.st-btn.completed.on{background:var(--success);color:#fff}
.st-btn.cancelled.on{background:var(--danger);color:#fff}

/* ACTION BUTTONS */
.act-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
.act-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;font-weight:800;font-size:.95rem;transition:.2s}
.act-btn.self{background:#f3ecef;color:var(--self)} .act-btn.self:hover{background:var(--self);color:#fff}
.act-btn.wa{background:#e3f6ea;color:var(--success)} .act-btn.wa:hover{background:var(--success);color:#fff}
.act-btn.print{background:#fff1c9;color:var(--gold)} .act-btn.print:hover{background:var(--gold);color:#fff}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--brand-deep);color:#fff;font-weight:700;padding:12px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:.3s;z-index:3000;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:var(--success)}
.toast.bad{background:var(--danger)}

/* RESPONSIVE */
@media(max-width:899px){
  .sidebar{transform:translateX(100%);width:290px;max-width:86vw;box-shadow:0 0 24px rgba(0,0,0,.18);top:0;height:100vh;height:100dvh;padding-top:calc(var(--top-h) + 10px);z-index:1100}
  .sidebar.open{transform:none}
  .overlay{z-index:1050}
  .main{margin-right:0;padding:calc(var(--top-h) + 14px) 14px 40px}
  .u-txt{display:none}
  .user-btn{padding:4px}
  .badge-admin{display:none}
}
@media(min-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .tabs{grid-template-columns:repeat(5,1fr)}
}
@media(min-width:900px){
  #menuBtn{display:none}
  .hero{padding:28px}.hero h1{font-size:2rem}
  .grid{grid-template-columns:repeat(3,1fr)}
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:26px}
  .act-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* PRINT INVOICE (CLEAN) */
@media print{
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; left: 0; top: 0; width: 100%; }
}
</style>
</head>

<script>
const API_URL = '/api';
const FALLBACK = 'assets/g-1.jpeg';
const STORE_PHONE = '96895544676';

let user = null, permissions = [];
let allOrders = [], filteredOrders = [];
let currentStatus = 'all', currentOrderId = null;

const STATUS = {
  pending:   {label:'قيد الانتظار', icon:'alert',     cls:'st-pending'},
  confirmed: {label:'مؤكد',         icon:'check',     cls:'st-confirmed'},
  completed: {label:'مكتمل',        icon:'star',      cls:'st-completed'},
  cancelled: {label:'ملغي',         icon:'x',         cls:'st-cancelled'}
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => String(parseFloat((Number(n) || 0).toFixed(3)));
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const can = p => !!user && (user.is_admin || permissions.includes(p));

/* ---------- الدخول والصلاحيات ---------- */
function goLogin(){ location.href = 'login.html'; }
function clearSession(){ ['sukkar_token','sukkar_user','sukkar_permissions'].forEach(k => localStorage.removeItem(k)); }
function confirmLogout(){ clearSession(); goLogin(); }

function init(){
  const token = localStorage.getItem('sukkar_token');
  try{
    user = JSON.parse(localStorage.getItem('sukkar_user') || 'null');
    permissions = JSON.parse(localStorage.getItem('sukkar_permissions') || '[]');
    if(!Array.isArray(permissions)) permissions = [];
  }catch(e){ user = null; }
  if(!token || !user || typeof user !== 'object') return goLogin();

  const name = user.full_name || user.username || 'المدير';
  const first = name.trim().charAt(0).toUpperCase(), role = user.is_admin ? 'المدير العام' : 'موظف';
  ['userAvatar','menuAvatar'].forEach(i => $(i).textContent = first);
  userName.textContent = menuName.textContent = name;
  userRole.textContent = menuRole.textContent = role;

  document.querySelectorAll('.s-link[data-permission]').forEach(a => {
    if(can(a.dataset.permission)) a.closest('.side-sec').hidden = false; else a.hidden = true;
  });

  if(!can('orders.view')){
    grid.innerHTML = `<div class="state"><div class="ring">${ic('lock')}</div><h3>ما عندك صلاحية</h3><p>هذي الصفحة تحتاج صلاحية إدارة الطلبات</p></div>`;
    return;
  }
  bindEvents(); loadOrders();
}

/* ---------- الاتصال بالـ API ---------- */
async function api(path, opts = {}){
  const headers = {'Authorization': 'Bearer ' + (localStorage.getItem('sukkar_token') || ''), ...(opts.headers || {})};
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 20000);
  try{
    const res = await fetch(API_URL + path, {...opts, headers, signal: ctrl.signal});
    if(res.status === 401){ clearSession(); goLogin(); throw new Error('unauthorized'); }
    const data = await res.json().catch(() => ({}));
    return {res, data};
  } finally { clearTimeout(to); }
}

async function loadOrders(){
  try{
    const {res, data} = await api('/sales/online');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    allOrders = Array.isArray(data) ? data : (data.orders || []);
    updateCounts(); render();
  }catch(err){
    console.error(err);
    grid.innerHTML = `<div class="state"><div class="ring">${ic('alert')}</div><h3>تعذّر تحميل الطلبات</h3></div>`;
  }
}

/* ---------- الإحصائيات والعرض ---------- */
function updateCounts(){
  $('cnt-all').textContent = allOrders.length;
  ['pending','confirmed','completed','cancelled'].forEach(st => {
    $('cnt-' + st).textContent = allOrders.filter(o => o.status === st).length;
  });
}

function setTab(st){
  currentStatus = st;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.st === st));
  render();
}

function render(){
  filteredOrders = currentStatus === 'all' ? allOrders : allOrders.filter(o => o.status === currentStatus);
  if(!filteredOrders.length){
    grid.innerHTML = `<div class="state"><div class="ring">${ic('inbox')}</div><h3>لا توجد طلبات</h3><p>لم يتم استلام طلبات في هذا القسم</p></div>`;
    return;
  }
  grid.innerHTML = filteredOrders.map(o => {
    const st = STATUS[o.status] || STATUS.pending;
    const date = new Date(o.created_at).toLocaleDateString('ar-OM', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    const initial = (o.customer_name || 'ع').charAt(0).toUpperCase();
    
    return `
      <div class="card ${st.cls}">
        <div class="c-head" onclick="openOrder(${o.id})">
          <div>
            <div class="c-num">${esc(o.invoice_number)}</div>
            <div class="c-date">${ic('cal')} ${date}</div>
          </div>
          <span class="c-badge b-${o.status}">${ic(st.icon)} ${st.label}</span>
        </div>
        <div class="c-cust" onclick="openOrder(${o.id})">
          <div class="c-av">${initial}</div>
          <div class="c-info">
            <div class="c-name">${esc(o.customer_name || 'عميل')}</div>
            <div class="c-phone">${esc(o.customer_phone || '')}</div>
          </div>
        </div>
        <div class="c-foot">
          <div class="c-total">${fmt(o.final_total)} <img class="omr-img" src="../assets/omr-dark.png" alt="ر.ع"></div>
          <div class="c-acts">
            <button class="c-btn self" onclick="sendToSelf(${o.id})" title="إرسال لنفسي">${ic('send')}</button>
            ${o.customer_phone ? `<button class="c-btn wa" onclick="openWA('${esc(o.customer_phone)}', '${esc(o.invoice_number)}')" title="واتساب العميل">${ic('wa')}</button>` : ''}
            <button class="c-btn view" onclick="openOrder(${o.id})" title="عرض">${ic('eye')}</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ---------- نافذة الطلب ---------- */
async function openOrder(id){
  currentOrderId = id;
  $('orderModalContent').innerHTML = `<div class="sh-body" style="text-align:center;padding:40px;">${ic('refresh')} جاري التحميل...</div>`;
  openModal('orderModal');

  try{
    const {res, data} = await api('/sales/' + id);
    if(!res.ok) throw new Error();
    const order = data.sale || allOrders.find(o => o.id === id);
    const items = data.items || [];
    const st = STATUS[order.status] || STATUS.pending;
    
    $('orderModalContent').innerHTML = `
      <div class="sh-head">
        <h2>${ic('bag')}<span>${esc(order.invoice_number)}</span></h2>
        <button class="sh-x" onclick="closeModal('orderModal')">${ic('x')}</button>
      </div>
      <div class="sh-body">
        <div class="sec-title">${ic('user')} بيانات العميل</div>
        <div class="info-box">
          <div class="info-row"><span class="l">الاسم:</span><span class="v">${esc(order.customer_name)}</span></div>
          <div class="info-row"><span class="l">الهاتف:</span><span class="v">${esc(order.customer_phone)}</span></div>
          ${order.customer_address ? `<div class="info-row"><span class="l">العنوان:</span><span class="v">${esc(order.customer_address)}</span></div>` : ''}
        </div>

        <div class="sec-title">${ic('box')} المنتجات (${items.length})</div>
        <div class="items-list">
          ${items.map(it => `
            <div class="item">
              <div class="item-img">${ic('bag')}</div>
              <div class="item-info">
                <div class="item-name">${esc(it.product_name)}</div>
                <div class="item-meta">${fmt(it.price)} × ${it.quantity}</div>
              </div>
              <div class="item-price">${fmt(it.subtotal)} <img class="omr-img" src="../assets/omr-dark.png"></div>
            </div>
          `).join('')}
        </div>

        <div class="sec-title">${ic('tag')} الفاتورة</div>
        <div class="totals">
          <div class="t-row"><span>المجموع:</span><span class="v">${fmt(order.total)}</span></div>
          ${order.delivery_cost > 0 ? `<div class="t-row"><span>التوصيل:</span><span class="v">${fmt(order.delivery_cost)}</span></div>` : ''}
          ${order.discount > 0 ? `<div class="t-row"><span>الخصم:</span><span class="v" style="color:var(--success)">-${fmt(order.discount)}</span></div>` : ''}
          <div class="t-row final"><span>الإجمالي:</span><span class="v">${fmt(order.final_total)} <img class="omr-img" src="../assets/omr-dark.png"></span></div>
        </div>

        <div class="sec-title">${ic('refresh')} حالة الطلب</div>
        <div class="st-grid">
          ${['pending','confirmed','completed','cancelled'].map(k => `
            <button class="st-btn ${k} ${order.status === k ? 'on' : ''}" onclick="changeStatus(${order.id}, '${k}')">
              ${ic(STATUS[k].icon)} ${STATUS[k].label}
            </button>
          `).join('')}
        </div>

        <div class="act-grid">
          <button class="act-btn self" onclick="sendToSelf(${order.id})">${ic('send')} إرسال لنفسي</button>
          ${order.customer_phone ? `<button class="act-btn wa" onclick="openWA('${esc(order.customer_phone)}', '${esc(order.invoice_number)}')">${ic('wa')} واتساب العميل</button>` : ''}
          <button class="act-btn print" onclick="printInvoice(${order.id})">${ic('print')} طباعة الفاتورة</button>
        </div>
      </div>
    `;
  }catch(e){
    $('orderModalContent').innerHTML = `<div class="sh-body" style="text-align:center;padding:40px;color:var(--danger)">${ic('alert')} تعذر تحميل التفاصيل<br><button class="btn btn-s" onclick="closeModal('orderModal')" style="margin-top:10px">إغلاق</button></div>`;
  }
}

/* ---------- تغيير الحالة ---------- */
async function changeStatus(id, status){
  try{
    const {res, data} = await api('/sales/' + id + '/status', {
      method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})
    });
    if(res.ok && data.success){
      toast('تم تحديث الحالة', 'ok');
      const o = allOrders.find(x => x.id === id);
      if(o) o.status = status;
      updateCounts(); render(); openOrder(id);
    } else toast(data.message || 'تعذر التحديث', 'bad');
  }catch(e){ toast('تعذر الاتصال', 'bad'); }
}

/* ---------- إرسال لنفسي ---------- */
async function sendToSelf(id){
  const o = allOrders.find(x => x.id === id); if(!o) return;
  try{
    const {data} = await api('/sales/' + id);
    const order = data.sale || o, items = data.items || [];
    
    let msg = `*تفاصيل طلب جديد*\n------------------\n*رقم الطلب:* ${order.invoice_number}\n\n*بيانات العميل:*\n- الاسم: ${order.customer_name}\n- الهاتف: ${order.customer_phone}\n`;
    if(order.customer_address) msg += `- العنوان: ${order.customer_address}\n`;
    msg += `\n*المنتجات:*\n`;
    items.forEach(i => msg += `- ${i.product_name} × ${i.quantity} = ${fmt(i.subtotal)} ر.ع\n`);
    msg += `\n*الإجمالي:* ${fmt(order.final_total)} ر.ع\n------------------\nSukkar Store`;
    
    try{ await navigator.clipboard.writeText(msg); toast('تم النسخ، جاري فتح واتساب...', 'ok'); }catch(e){}
    setTimeout(() => window.open('https://wa.me/' + STORE_PHONE + '?text=' + encodeURIComponent(msg), '_blank'), 400);
  }catch(e){ toast('تعذر الاتصال', 'bad'); }
}

/* ---------- واتساب العميل ---------- */
function openWA(phone, inv){
  let p = String(phone).replace(/\D/g, '');
  if(!p.startsWith('968')) p = '968' + p;
  const msg = `مرحباً،\nنتواصل معك بخصوص طلبك رقم: ${inv}\nمن Sukkar Store.`;
  window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(msg), '_blank');
}

/* ---------- طباعة الفاتورة (تصميم نظيف) ---------- */
async function printInvoice(id){
  try{
    const {data} = await api('/sales/' + id);
    const order = data.sale, items = data.items || [];
    const date = new Date(order.created_at).toLocaleDateString('ar-OM', {year:'numeric', month:'long', day:'numeric'});
    
    const html = `
      <div style="font-family:'Cairo',sans-serif;direction:rtl;padding:40px;max-width:800px;margin:0 auto;color:#333;">
        <div style="text-align:center;border-bottom:2px solid #b2437b;padding-bottom:20px;margin-bottom:30px;">
          <h1 style="color:#b2437b;font-size:28px;margin:0 0 8px;font-family:'Baloo 2',sans-serif;">SUKKAR STORE</h1>
          <p style="color:#666;font-size:14px;margin:0;">فاتورة ضريبية مبسطة</p>
        </div>
        
        <div style="display:flex;justify-content:space-between;margin-bottom:30px;font-size:14px;font-weight:600;">
          <div><span style="color:#888;">رقم الفاتورة:</span> ${order.invoice_number}</div>
          <div><span style="color:#888;">التاريخ:</span> ${date}</div>
        </div>

        <div style="background:#fdf8fa;padding:20px;border-radius:12px;margin-bottom:30px;border:1px solid #f1e4ea;">
          <h3 style="color:#b2437b;margin:0 0 15px;font-size:16px;">بيانات العميل</h3>
          <p style="margin:6px 0;"><span style="color:#888;width:80px;display:inline-block;">الاسم:</span> <strong>${order.customer_name}</strong></p>
          <p style="margin:6px 0;"><span style="color:#888;width:80px;display:inline-block;">الهاتف:</span> <strong>${order.customer_phone}</strong></p>
          ${order.customer_address ? `<p style="margin:6px 0;"><span style="color:#888;width:80px;display:inline-block;">العنوان:</span> <strong>${order.customer_address}</strong></p>` : ''}
        </div>

        <table style="width:100%;border-collapse:collapse;margin-bottom:30px;">
          <thead>
            <tr style="background:#b2437b;color:#fff;">
              <th style="padding:12px;text-align:right;border-radius:0 8px 0 0;">المنتج</th>
              <th style="padding:12px;text-align:center;">الكمية</th>
              <th style="padding:12px;text-align:center;">السعر</th>
              <th style="padding:12px;text-align:left;border-radius:8px 0 0 0;">المجموع</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr style="border-bottom:1px solid #eee;">
                <td style="padding:12px;font-weight:600;">${i.product_name}</td>
                <td style="padding:12px;text-align:center;">${i.quantity}</td>
                <td style="padding:12px;text-align:center;">${fmt(i.price)}</td>
                <td style="padding:12px;text-align:left;font-weight:700;">${fmt(i.subtotal)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div style="background:#fdf8fa;padding:20px;border-radius:12px;border:1px solid #f1e4ea;">
          <div style="display:flex;justify-content:space-between;padding:6px 0;color:#666;">
            <span>المجموع:</span><span>${fmt(order.total)} ر.ع</span>
          </div>
          ${order.delivery_cost > 0 ? `<div style="display:flex;justify-content:space-between;padding:6px 0;color:#666;"><span>التوصيل:</span><span>${fmt(order.delivery_cost)} ر.ع</span></div>` : ''}
          ${order.discount > 0 ? `<div style="display:flex;justify-content:space-between;padding:6px 0;color:#2e9e5b;"><span>الخصم:</span><span>- ${fmt(order.discount)} ر.ع</span></div>` : ''}
          <div style="display:flex;justify-content:space-between;padding:15px 0 0;margin-top:10px;border-top:2px solid #b2437b;font-size:20px;font-weight:800;color:#b2437b;">
            <span>الإجمالي النهائي:</span><span>${fmt(order.final_total)} ر.ع</span>
          </div>
        </div>

        <div style="text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #eee;color:#888;font-size:13px;">
          <p style="margin:5px 0;">شكراً لتعاملكم معنا</p>
          <p style="margin:5px 0;font-weight:700;color:#b2437b;">SUKKAR STORE</p>
        </div>
      </div>
    `;
    
    $('printArea').innerHTML = html;
    $('printArea').style.display = 'block';
    setTimeout(() => { window.print(); $('printArea').style.display = 'none'; }, 100);
  }catch(e){ toast('تعذر الطباعة', 'bad'); }
}

/* ---------- القوائم والنوافذ ---------- */
function toggleSidebar(){
  const open = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open);
  document.body.classList.toggle('lock', open);
}
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); if(!document.querySelector('.modal.open')) document.body.classList.remove('lock'); }
function toggleUserMenu(e){ e.stopPropagation(); const open = userMenu.hidden; userMenu.hidden = !open; userBtn.setAttribute('aria-expanded', open); }
function closeUserMenu(){ userMenu.hidden = true; userBtn.setAttribute('aria-expanded', 'false'); }

function openModal(id){ closeUserMenu(); $(id).classList.add('open'); document.body.classList.add('lock'); }
function closeModal(id){
  $(id).classList.remove('open');
  if(!document.querySelector('.modal.open') && !sidebar.classList.contains('open')) document.body.classList.remove('lock');
}
let tt;
function toast(msg, type){ const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type || ''); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

function bindEvents(){
  document.addEventListener('click', e => { if(!userMenu.hidden && !userMenu.contains(e.target)) closeUserMenu(); });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    const open = [...document.querySelectorAll('.modal.open')].pop();
    if(open) closeModal(open.id); else { closeUserMenu(); closeSidebar(); }
  });
  window.addEventListener('resize', () => { if(innerWidth >= 900) closeSidebar(); });
}

init();
</script>
</body>
