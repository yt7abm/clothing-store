<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الحساب - قيد التطوير | متجر راقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1e3a8a;
  --primary-light: #3b82f6;
  --primary-dark: #1e40af;
  --accent: #f59e0b;
  --accent-2: #ec4899;
  --gold: #d4af37;
  --bg: #ffffff;
  --bg-2: #f9fafb;
  --bg-3: #f3f4f6;
  --text: #1f2937;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 40px rgba(30, 58, 138, 0.12);
  --shadow-xl: 0 20px 60px rgba(30, 58, 138, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: 'Cairo', sans-serif; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

/* ========== Header ========== */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  padding: 12px 0;
}

.nav {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 15px;
}

.nav-right, .nav-left { display: flex; align-items: center; gap: 8px; }
.nav-right { justify-content: flex-start; }
.nav-left { justify-content: flex-end; }

.logo {
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  justify-content: center;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1rem;
  box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
}

.icon-btn {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.icon-btn:hover { background: var(--bg-3); color: var(--primary); }

.icon-btn svg {
  width: 22px;
  height: 22px;
  stroke-width: 1.8;
  stroke: currentColor;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ========== Main Content ========== */
.main-content {
  flex: 1 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 60px;
  position: relative;
  overflow: hidden;
}

/* خلفية متحركة */
.main-content::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 20%, rgba(30, 58, 138, 0.06), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.06), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.04), transparent 60%);
  z-index: -1;
  animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.account-container {
  max-width: 550px;
  width: 100%;
  text-align: center;
  animation: slideUp 0.8s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Icon */
.account-icon {
  width: 140px;
  height: 140px;
  margin: 0 auto 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4.5rem;
  box-shadow: 0 20px 60px rgba(30, 58, 138, 0.3);
  position: relative;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* حلقات حول الأيقونة */
.account-icon::before,
.account-icon::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 3px dashed rgba(30, 58, 138, 0.2);
}

.account-icon::before {
  inset: -15px;
  animation: rotate 20s linear infinite;
}

.account-icon::after {
  inset: -30px;
  border-style: dotted;
  animation: rotate 30s linear infinite reverse;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Title */
.account-title {
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 900;
  color: var(--text);
  margin-bottom: 15px;
  line-height: 1.2;
}

.account-title span {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Badge */
.account-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(245, 158, 11, 0.1);
  border: 1.5px solid rgba(245, 158, 11, 0.3);
  color: var(--warning);
  padding: 8px 20px;
  border-radius: 25px;
  font-size: 0.85rem;
  font-weight: 900;
  margin-bottom: 20px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.3); }
  50% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
}

/* Description */
.account-desc {
  color: var(--text-muted);
  font-size: clamp(0.9rem, 2vw, 1.05rem);
  line-height: 1.8;
  margin-bottom: 35px;
  max-width: 450px;
  margin-left: auto;
  margin-right: auto;
}

/* Features */
.account-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 35px;
}

.feature-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
  transition: all 0.3s;
}

.feature-item:hover {
  border-color: var(--primary-light);
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.feature-icon {
  font-size: 2rem;
  margin-bottom: 8px;
}

.feature-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
}

/* Progress */
.progress-section {
  background: white;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 30px;
  text-align: right;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.progress-label {
  font-size: 0.85rem;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.progress-percent {
  font-size: 0.95rem;
  font-weight: 900;
  color: var(--primary);
}

.progress-bar {
  height: 10px;
  background: var(--bg-3);
  border-radius: 5px;
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 5px;
  width: 0%;
  transition: width 2s ease;
  position: relative;
  overflow: hidden;
}

.progress-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* Buttons */
.account-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action-btn {
  padding: 16px 20px;
  border-radius: 14px;
  font-weight: 900;
  font-size: 0.95rem;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
}

.action-btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 10px 30px rgba(30, 58, 138, 0.25);
}

.action-btn.primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(30, 58, 138, 0.35);
}

.action-btn.secondary {
  background: white;
  color: var(--text);
  border: 1.5px solid var(--border);
}

.action-btn.secondary:hover {
  background: var(--bg-2);
  border-color: var(--primary-light);
  transform: translateY(-3px);
}

/* Footer */
.footer-bottom {
  margin-top: 40px;
  padding-top: 25px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.8rem;
  text-align: center;
}

/* ========== Responsive ========== */
@media (max-width: 600px) {
  .nav { padding: 0 12px; gap: 8px; }
  .logo { font-size: 1rem; }
  .logo-icon { width: 32px; height: 32px; font-size: 0.9rem; }
  .icon-btn { width: 38px; height: 38px; }
  .icon-btn svg { width: 20px; height: 20px; }

  .main-content { padding: 90px 15px 40px; }

  .account-icon {
    width: 110px;
    height: 110px;
    font-size: 3.5rem;
    margin-bottom: 25px;
  }

  .account-title {
    font-size: 1.4rem;
  }

  .account-desc {
    font-size: 0.85rem;
  }

  .account-features {
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 25px;
  }

  .feature-item {
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: right;
  }

  .feature-icon {
    font-size: 1.6rem;
    margin: 0;
  }

  .progress-section {
    padding: 16px;
    border-radius: 16px;
  }

  .account-actions {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .action-btn {
    padding: 14px;
    font-size: 0.9rem;
  }
}

@media (max-width: 360px) {
  .account-icon {
    width: 95px;
    height: 95px;
    font-size: 3rem;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <nav class="nav">
    <div class="nav-right">
      <a href="search.html" class="icon-btn" title="البحث">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
    </div>
    <a href="../index.html" class="logo">
      <div class="logo-icon">✨</div>
      متجر راقي
    </a>
    <div class="nav-left">
      <a href="orders.html" class="icon-btn" title="طلباتي">
        <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      </a>
    </div>
  </nav>
</header>

<!-- Main Content -->
<main class="main-content">
  <div class="account-container">
    
    <!-- Icon -->
    <div class="account-icon">🛠️</div>

    <!-- Badge -->
    <div class="account-badge">
      🚧 قيد التطوير
    </div>

    <!-- Title -->
    <h1 class="account-title">
      صفحة <span>الحساب</span>
    </h1>

    <!-- Description -->
    <p class="account-desc">
      نعمل حالياً على تطوير هذه الصفحة لتجربة أفضل. 
      قريباً ستتمكن من إدارة حسابك، ومتابعة طلباتك، 
      وحفظ منتجاتك المفضلة. تابعنا! ✨
    </p>

    <!-- Features -->
    <div class="account-features">
      <div class="feature-item">
        <div class="feature-icon">👤</div>
        <div class="feature-title">إدارة الحساب</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📦</div>
        <div class="feature-title">متابعة الطلبات</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">❤️</div>
        <div class="feature-title">المفضلة</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <div class="progress-label">
          ⚡ التقدم
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="account-actions">
      <a href="../index.html" class="action-btn primary">
        🏠 العودة للرئيسية
      </a>
      <a href="search.html" class="action-btn secondary">
        🛍️ متابعة التسوق
      </a>
    </div>

    <!-- Footer -->
    <div class="footer-bottom">
      © 2026 متجر راقي — جميع الحقوق محفوظة
    </div>

  </div>
</main>

<script>
// ========== أنيميشن شريط التقدم ==========
document.addEventListener('DOMContentLoaded', () => {
  const progressFill = document.getElementById('progressFill');
  const progressPercent = document.getElementById('progressPercent');
  
  // النسبة المئوية
  const targetPercent = 75;
  
  // تأخير بسيط بعد تحميل الصفحة
  setTimeout(() => {
    progressFill.style.width = targetPercent + '%';
    
    // عداد متحرك للرقم
    let currentPercent = 0;
    const interval = setInterval(() => {
      currentPercent++;
      progressPercent.textContent = currentPercent + '%';
      
      if (currentPercent >= targetPercent) {
        clearInterval(interval);
      }
    }, 20);
  }, 300);
});
</script>

</body>
</html>
