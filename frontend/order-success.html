<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تم الطلب - متجر راقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  background: #0f0b1e;
  color: #f5f3ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.2), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(244, 114, 182, 0.15), transparent 40%);
  z-index: -1;
}

.container {
  background: linear-gradient(135deg, #1e1b3a, #252047);
  border: 2px solid #8b5cf6;
  border-radius: 25px;
  padding: 45px 35px;
  max-width: 550px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 80px rgba(139, 92, 246, 0.4);
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.icon {
  font-size: 5.5rem;
  margin-bottom: 15px;
  animation: bounce 1.5s ease infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

h1 {
  background: linear-gradient(135deg, #fbbf24, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 2rem;
  font-weight: 900;
  margin-bottom: 12px;
}

.subtitle {
  color: #a5a1b8;
  font-size: 1rem;
  margin-bottom: 30px;
}

.info-card {
  background: #0f0b1e;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid rgba(139, 92, 246, 0.3);
  text-align: right;
  position: relative;
}

.info-label {
  color: #a5a1b8;
  font-size: 0.85rem;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.info-value {
  color: #a78bfa;
  font-size: 1.4rem;
  font-weight: 900;
  font-family: monospace;
  letter-spacing: 1px;
  word-break: break-all;
}

.info-value.amount {
  background: linear-gradient(135deg, #fbbf24, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-family: 'Cairo', sans-serif;
  font-size: 1.5rem;
}

.copy-btn {
  background: rgba(139, 92, 246, 0.2);
  color: #a78bfa;
  border: 1px solid #8b5cf6;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.copy-btn:hover {
  background: #8b5cf6;
  color: white;
  transform: translateY(-2px);
}

.copy-btn.copied {
  background: #10b981;
  border-color: #10b981;
  color: white;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 30px;
}

.btn {
  flex: 1;
  padding: 16px;
  border-radius: 14px;
  font-weight: 700;
  font-family: 'Cairo', sans-serif;
  text-decoration: none;
  text-align: center;
  transition: all 0.3s;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary {
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  color: white;
  box-shadow: 0 15px 40px rgba(139, 92, 246, 0.3);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 50px rgba(139, 92, 246, 0.5);
}

.btn-secondary {
  background: transparent;
  color: #f5f3ff;
  border: 2px solid rgba(139, 92, 246, 0.3);
}

.btn-secondary:hover {
  border-color: #8b5cf6;
  color: #a78bfa;
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  padding: 14px 24px;
  border-radius: 12px;
  font-weight: 700;
  box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
  transform: translateX(500px);
  transition: transform 0.4s;
  z-index: 9999;
  font-size: 0.95rem;
}

.toast.show { transform: translateX(0); }

@media (max-width: 600px) {
  body { padding: 15px; }
  .container { padding: 35px 22px; border-radius: 20px; }
  .icon { font-size: 4.5rem; margin-bottom: 12px; }
  h1 { font-size: 1.5rem; }
  .subtitle { font-size: 0.9rem; margin-bottom: 25px; }
  .info-card { padding: 16px; margin-bottom: 12px; }
  .info-label { font-size: 0.8rem; margin-bottom: 8px; }
  .info-value { font-size: 1.15rem; }
  .info-value.amount { font-size: 1.25rem; }
  .copy-btn { padding: 5px 10px; font-size: 0.75rem; }
  .actions { flex-direction: column; gap: 10px; }
  .btn { padding: 14px; font-size: 0.95rem; }
  .toast { bottom: 15px; right: 15px; left: 15px; text-align: center; }
}

@media (max-width: 380px) {
  .container { padding: 30px 18px; }
  h1 { font-size: 1.3rem; }
  .info-value { font-size: 1rem; }
}

@media print {
  body {
    background: white !important;
    color: black !important;
    padding: 0;
    display: block;
    min-height: auto;
  }
  
  body::before { display: none; }
  
  .container {
    background: white !important;
    border: 2px solid #000 !important;
    box-shadow: none !important;
    animation: none !important;
    max-width: 100%;
    width: 100%;
    margin: 20px;
    padding: 30px;
    page-break-inside: avoid;
  }
  
  .icon { animation: none; font-size: 3rem; }
  
  h1 {
    background: none !important;
    -webkit-text-fill-color: #000 !important;
    color: #000 !important;
    font-size: 1.8rem;
  }
  
  .subtitle { color: #333 !important; }
  
  .info-card {
    background: white !important;
    border: 1px solid #000 !important;
    page-break-inside: avoid;
  }
  
  .info-label { color: #333 !important; }
  
  .info-value {
    color: #000 !important;
    font-size: 1.3rem;
  }
  
  .info-value.amount {
    background: none !important;
    -webkit-text-fill-color: #000 !important;
    color: #000 !important;
  }
  
  .actions, .copy-btn, .toast { display: none !important; }
}
</style>
</head>
<body>

<div class="container">
  <div class="icon">🎉</div>
  <h1>تم استلام طلبك!</h1>
  <p class="subtitle">سيتم التواصل معك قريباً لتأكيد الطلب</p>
  
  <div class="info-card">
    <div class="info-label">
      <span>🎫 رقم الطلب</span>
      <button class="copy-btn" onclick="copyInvoice()" id="copyBtn">
        📋 نسخ
      </button>
    </div>
    <div class="info-value" id="invNumber">-</div>
  </div>
  
  <div class="info-card">
    <div class="info-label">💰 الإجمالي المدفوع</div>
    <div class="info-value amount" id="paidAmount">-</div>
  </div>
  
  <div class="info-card">
    <div class="info-label">💳 طريقة الدفع</div>
    <div class="info-value" style="font-family:'Cairo',sans-serif;font-size:1.1rem;" id="payMethod">-</div>
  </div>
  
  <div class="actions">
    <a href="../index.html" class="btn btn-primary">🏠 الرئيسية</a>
    <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<div class="toast" id="toast">✅ تم نسخ رقم الطلب</div>

<script>
// ========================================
// قراءة بيانات الطلب
// ========================================
const orderData = JSON.parse(localStorage.getItem('lastOrder') || '{}');

let currentInvoice = '';

if (orderData.invoice_number) {
  currentInvoice = orderData.invoice_number;
  
  document.getElementById('invNumber').textContent = orderData.invoice_number;
  document.getElementById('paidAmount').textContent = `${parseFloat(orderData.final_total).toFixed(3)} ر.ع`;
  document.getElementById('payMethod').textContent = 
    orderData.payment_method === 'cash' ? '💵 نقداً' : '🏦 تحويل بنكي';
  
  // مسح البيانات بعد 5 ثواني
  setTimeout(() => {
    localStorage.removeItem('lastOrder');
  }, 5000);
} else {
  // لو ما فيه بيانات، ارجع للرئيسية
  setTimeout(() => window.location.href = '../index.html', 1500);
}

// ========================================
// نسخ رقم الطلب
// ========================================
async function copyInvoice() {
  if (!currentInvoice) return;
  
  try {
    // الطريقة الحديثة
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(currentInvoice);
    } else {
      // طريقة احتياطية
      const textArea = document.createElement('textarea');
      textArea.value = currentInvoice;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
    }
    
    showToast();
    
    // تغيير شكل الزر
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = '✅ تم النسخ';
    
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 نسخ';
    }, 2000);
    
  } catch (error) {
    console.error('خطأ في النسخ:', error);
    alert('تعذّر النسخ. رقم الطلب: ' + currentInvoice);
  }
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
